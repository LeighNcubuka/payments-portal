version: 2.1

jobs:
  build-and-test-frontend:
    docker:
      - image: cimg/node:20.0
    working_directory: ~/project/frontend  # Adjust if needed (e.g., ~/project/payments-portal/frontend)
    steps:
      - checkout
      - run:
          name: Install Frontend Dependencies
          command: npm install
      - run:
          name: Build Frontend
          command: npm run build
      - run:
          name: Run Frontend Tests
          command: npm test -- --watchAll=false || true

  build-and-test-backend:
    docker:
      - image: cimg/node:20.0
    working_directory: ~/project/backend  # Adjust if needed (e.g., ~/project/payments-portal/backend)
    steps:
      - checkout
      - run:
          name: Install Backend Dependencies
          command: npm install
      - run:
          name: Run Backend Tests
          command: npm test || true

workflows:
  version: 2
  build-and-test:
    jobs:
      - build-and-test-frontend
      - build-and-test-backend